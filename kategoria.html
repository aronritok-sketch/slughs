<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Webshop – Slugshop</title>
<meta name="description" content="ZAN slugok, JSB diabolók, FX légfegyverek, kiegészítők és gyári FX alkatrészek szűrhető kínálata.">
<meta name="theme-color" content="#10120d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&family=Big+Shoulders+Stencil+Display:wght@800;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="category">
<div id="site-header"></div>

<main id="main">
  <section class="page-head grid-bg">
    <div class="wrap">
      <ol class="crumbs"><li><a href="index.html">Kezdőlap</a></li><li id="cat-crumb" aria-current="page">Webshop</li></ol>
      <h1 id="cat-title">Webshop</h1>
      <p id="cat-desc"></p>
    </div>
  </section>

  <div class="wrap shop">
    <aside class="filters" id="filters" data-layer data-keep-aria aria-label="Szűrők"></aside>
    <div>
      <div class="toolbar">
        <div style="display:flex;gap:12px;align-items:center">
          <button class="btn btn--ghost btn--sm filter-open" type="button" id="filter-open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></svg>Szűrők</button>
          <span class="toolbar-count" id="count" aria-live="polite"></span>
        </div>
        <div class="toolbar-right">
          <label class="sr-only" for="sort">Rendezés</label>
          <select class="select" id="sort">
            <option value="default">Ajánlott sorrend</option>
            <option value="asc">Ár szerint növekvő</option>
            <option value="desc">Ár szerint csökkenő</option>
            <option value="name">Név szerint A–Z</option>
          </select>
          <div class="view-toggle" role="group" aria-label="Nézet">
            <button type="button" data-view="grid" aria-label="Rácsnézet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
            <button type="button" data-view="list" aria-label="Listanézet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
          </div>
        </div>
      </div>
      <div class="active-filters" id="active-filters"></div>
      <div class="products" id="grid"></div>
      <div class="pager"><button class="btn btn--ghost" type="button" id="more" hidden><span></span></button></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
